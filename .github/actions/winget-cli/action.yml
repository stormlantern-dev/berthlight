name: Install winget
description: >
  Put a known winget on a Windows runner with Microsoft's own module for
  that (Microsoft.WinGet.Client, Repair-WinGetPackageManager), and allow
  installing from local manifests.

inputs:
  github-token:
    description: >
      Token for the module's GitHub API calls; anonymous calls from shared
      runner addresses hit the rate limit.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install winget
      shell: pwsh
      env:
        # winget-cli v1.29.380 and its PowerShell module, 2026-09-21.
        WINGET_VERSION: 1.29.380
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        # The image carries an older winget (v1.11 on windows-2025 in
        # October 2026), which does not know the manifests' schema 1.12 and
        # validates them against an older one. So always install this one.
        Install-PSResource -Name Microsoft.WinGet.Client -Version $env:WINGET_VERSION -Repository PSGallery -TrustRepository -Scope AllUsers
        Import-Module Microsoft.WinGet.Client -RequiredVersion $env:WINGET_VERSION
        Repair-WinGetPackageManager -AllUsers -Force -Version $env:WINGET_VERSION
        # winget is an app execution alias, in a directory new shells get.
        $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps'
        $env:PATH = "$alias;$env:PATH"
        Add-Content -Path $env:GITHUB_PATH -Value $alias
        # Portable packages are linked here; a later step runs them by name.
        Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links')
        $v = (winget --version).Trim()
        if ($v -ne "v$env:WINGET_VERSION") { throw "winget is $v, not v$env:WINGET_VERSION" }
        Write-Output "winget $v"
        winget settings --enable LocalManifestFiles
