name: Mint a release App token
description: >
  Mint a one-hour installation token for the release GitHub App, scoped to
  the repositories it publishes to, signing the App JWT with a key that
  lives in Cloud KMS. No secret is involved.

# The same pattern as dlouwers/typst-d2-mcp's tap-token action
# (dlouwers/experiments#505), with the owner and repositories as inputs.
#
# Writing the Homebrew cask and the Scoop manifest is machine access to other
# repositories, and a cask is Ruby that `brew` runs: whoever can write there
# can put code on every machine that installs from it. So no long-lived
# token: GitHub only issues installation tokens for a JWT signed with the
# App's private key, and that key is imported into Cloud KMS
# (non-exportable). This action proves who it is through GitHub OIDC →
# Workload Identity Federation, which only grants permission to SIGN with
# the key. The WIF provider admits this repository by numeric id, and only
# release.yml on a v* tag push or verify-release-credentials.yml dispatched
# on main.
#
# The calling job needs `permissions: id-token: write`. Composite actions
# have no post step: callers revoke the token at the end of the job,
# otherwise it expires after an hour.

inputs:
  client-id:
    description: GitHub App client id (repository variable TAP_APP_CLIENT_ID).
    required: true
  workload-identity-provider:
    description: Full WIF provider name (repository variable TAP_WIF_PROVIDER).
    required: true
  kms-key-version:
    description: Full KMS key version name (repository variable TAP_KMS_KEY_VERSION).
    required: true
  owner:
    description: Account the App is installed on.
    default: stormlantern-dev
  repositories:
    description: Space-separated repositories under the owner the token is scoped to.
    default: homebrew-tap scoop-bucket

outputs:
  token:
    description: Installation token, Contents write on the given repositories only.
    value: ${{ steps.mint.outputs.token }}

runs:
  using: composite
  steps:
    # Direct WIF: the federated token itself is authorised on the KMS key,
    # so there is no service account to impersonate, and no credentials
    # file: GoReleaser refuses to release from a dirty tree.
    - name: Authenticate to Google Cloud
      id: gcp
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        create_credentials_file: false

    - name: Sign the App JWT in KMS and exchange it
      id: mint
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.client-id }}
        KEY_VERSION: ${{ inputs.kms-key-version }}
        OWNER: ${{ inputs.owner }}
        REPOSITORIES: ${{ inputs.repositories }}
        GCP_TOKEN: ${{ steps.gcp.outputs.auth_token }}
      run: |
        set -euo pipefail
        b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

        # GitHub caps exp at ten minutes; iat is backdated against clock skew.
        now=$(date +%s)
        header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
        payload=$(jq -cn --arg iss "$CLIENT_ID" --argjson iat $((now - 60)) --argjson exp $((now + 540)) \
          '{iat: $iat, exp: $exp, iss: $iss}' | tr -d '\n' | b64url)

        # KMS signs a digest, not a message: RSA_SIGN_PKCS1_2048_SHA256 over
        # the SHA-256 of "header.payload" is exactly RS256.
        digest=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -binary | openssl base64 -A)
        sig=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer ${GCP_TOKEN}" -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg d "$digest" '{digest: {sha256: $d}}')" \
            "https://cloudkms.googleapis.com/v1/${KEY_VERSION}:asymmetricSign" \
          | jq -er .signature | openssl base64 -d -A | b64url)
        jwt="${header}.${payload}.${sig}"
        echo "::add-mask::${jwt}"

        gh_api() {
          curl -fsS --retry 3 -H "Authorization: Bearer $1" \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${@:2}"
        }
        read -ra repos <<< "$REPOSITORIES"
        installation=$(gh_api "$jwt" "https://api.github.com/repos/${OWNER}/${repos[0]}/installation" | jq -er .id)
        token=$(gh_api "$jwt" -X POST \
            -d "$(jq -cn '{repositories: $ARGS.positional, permissions: {contents: "write"}}' --args "${repos[@]}")" \
            "https://api.github.com/app/installations/${installation}/access_tokens" \
          | jq -er .token)
        echo "::add-mask::${token}"
        echo "token=${token}" >> "$GITHUB_OUTPUT"
        echo "minted a token for ${OWNER}: ${repos[*]} (installation ${installation}), signed by ${KEY_VERSION##*/cryptoKeys/}"
