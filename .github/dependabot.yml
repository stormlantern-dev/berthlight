# Keeps pinned digests and SHAs current: base images in the Dockerfiles,
# GitHub Actions, and Go modules. Weekly, grouped, so updates come as one
# pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/"]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: ["/", "/tools/guides"]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
