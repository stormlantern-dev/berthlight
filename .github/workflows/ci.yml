name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./cmd/berthlight url
      # R8, R11: the skill installs on every platform, and the installed
      # copy passes the Agent Skills reference validator.
      - name: The README tools build and pass their tests
        if: runner.os == 'Linux'
        working-directory: tools/guides
        run: |
          go vet ./...
          go test ./...
      - name: Install the agent skill
        shell: bash
        run: go run ./cmd/berthlight skill install --agent all --project -C "$RUNNER_TEMP/project"
      - name: Validate the installed skill
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "git+https://github.com/agentskills/agentskills.git@f130f348f502d9804278a617f86929846896d2e9#subdirectory=skills-ref"
          for d in "$RUNNER_TEMP"/project/.claude/skills/berthlight "$RUNNER_TEMP"/project/.agents/skills/berthlight; do
            "$RUNNER_TEMP/venv/bin/skills-ref" validate "$d"
          done

  integration:
    # amd64 keeps the bare runtime name, which branch protection requires.
    name: integration (${{ matrix.runtime }}${{ matrix.arch == 'arm64' && ', arm64' || '' }})
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      BERTHLIGHT_RUNTIME: ${{ matrix.runtime }}
      BERTHLIGHT_IMAGE: localhost/berthlight:test
      BERTHLIGHT_REQUIRE_DEVCONTAINER: "1"
      BERTHLIGHT_REQUIRE_PEBBLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the Dev Container CLI
        run: npm install -g @devcontainers/cli@0.89.0
      - name: Install Podman
        if: matrix.runtime == 'podman'
        run: |
          command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }
          podman version
      # Rootless Podman cannot load kernel modules from its user namespace;
      # load the NAT ones its port forwarding needs.
      - name: Load NAT modules
        run: sudo modprobe -a nft_nat nft_masq nft_chain_nat || true
      # R7: Let's Encrypt's test ACME server and its DNS server, for the
      # HTTPS test.
      - name: Install Pebble
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1 github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
      - name: Build the proxy image
        run: ${{ matrix.runtime }} build -t "$BERTHLIGHT_IMAGE" .
      - name: Integration tests
        run: go test -tags integration -count=1 -v -timeout 15m ./test/integration

  # Shell completion (#36): each shell's script parses, and the nushell
  # completer answers through `berthlight __complete`. Not a required check.
  completion:
    name: completion scripts
    runs-on: ubuntu-latest
    env:
      NU_VERSION: 0.116.1
      NU_SHA256: d6d8ace4be491ed8abba4026e73b60c0470b4671d7039307e7d772282ef863da
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install zsh and fish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish
      - name: Install nushell
        run: |
          curl -fsSLo "$RUNNER_TEMP/nu.tar.gz" "https://github.com/nushell/nushell/releases/download/$NU_VERSION/nu-$NU_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$NU_SHA256  $RUNNER_TEMP/nu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nu.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nu-$NU_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Build berthlight
        run: |
          go build -o "$RUNNER_TEMP/bin/berthlight" ./cmd/berthlight
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Generate the scripts
        run: |
          mkdir -p "$RUNNER_TEMP/completions"
          cd "$RUNNER_TEMP/completions"
          berthlight completion bash > berthlight.bash
          berthlight completion zsh > _berthlight
          berthlight completion fish > berthlight.fish
          berthlight completion powershell > berthlight.ps1
          berthlight completion nushell > berthlight.nu
      - name: bash -n
        run: bash -n "$RUNNER_TEMP/completions/berthlight.bash"
      - name: zsh -n
        run: zsh -n "$RUNNER_TEMP/completions/_berthlight"
      - name: fish -n
        run: fish -n "$RUNNER_TEMP/completions/berthlight.fish"
      - name: PowerShell parses it
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:RUNNER_TEMP/completions/berthlight.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: nushell parses it, and the completer answers
        env:
          BERTHLIGHT_STATE_DIR: ${{ runner.temp }}/state
        run: |
          mkdir -p "$BERTHLIGHT_STATE_DIR"
          echo '{"routes": [{"name": "shop", "target": "web", "port": 8080}]}' > "$BERTHLIGHT_STATE_DIR/routes.json"
          cp "$RUNNER_TEMP/completions/berthlight.nu" berthlight-completion.nu
          nu --no-config-file -c '
            source berthlight-completion.nu
            let c = $env.config.completions.external.completer
            let rm = (do $c [berthlight rm ""] | get value)
            if $rm != [shop] { error make {msg: $"rm completes ($rm | to nuon), not [shop]"} }
            let sub = (do $c [berthlight sta] | get value)
            if $sub != [status] { error make {msg: $"sta completes ($sub | to nuon), not [status]"} }
            if (do $c [git ""]) != null { error make {msg: "the completer answers for git"} }
            print "nushell completer ok"
          '

  # R11: the release configuration builds on every pull request, images
  # included, without publishing or signing anything.
  release-snapshot:
    name: release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign
      - name: The packages install and run
        run: |
          sudo dpkg -i dist/berthlight_*_amd64.deb
          berthlight version
          # Shell completion, where each shell looks for it (#36).
          for f in /usr/share/bash-completion/completions/berthlight /usr/share/zsh/site-functions/_berthlight \
            /usr/share/fish/vendor_completions.d/berthlight.fish /usr/share/nushell/vendor/autoload/berthlight.nu; do
            test -s "$f" || { echo "::error::the deb lacks $f"; exit 1; }
          done
          command -v bsdtar || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools; }
          for p in dist/*.rpm dist/*.apk; do
            bsdtar -tf "$p" | grep -q 'usr/share/zsh/site-functions/_berthlight' || { echo "::error::$p lacks the zsh completion"; exit 1; }
          done
          for a in dist/berthlight_*.tar.gz dist/berthlight_*.zip; do
            bsdtar -tf "$a" | grep -q '^completions/berthlight.bash$' || { echo "::error::$a lacks the completions"; exit 1; }
          done
          grep -q 'zsh_completion "completions/_berthlight"' dist/homebrew/Casks/berthlight.rb
          docker run --rm --entrypoint /berthlight "$(docker images --format '{{.Repository}}:{{.Tag}}' ghcr.io/stormlantern-dev/berthlight | grep amd64 | head -1)" version
      # R10: the winget manifests a release would submit.
      - name: Find the winget manifests
        id: winget
        run: |
          dirs=(dist/winget/manifests/*/*/*/*/)
          test "${#dirs[@]}" -eq 1 || { echo "::error::expected one manifest directory, found: ${dirs[*]}"; exit 1; }
          echo "dir=${dirs[0]%/}" >> "$GITHUB_OUTPUT"
      - name: The winget manifests match the schemas
        uses: ./.github/actions/winget-schema
        with:
          manifests: ${{ steps.winget.outputs.dir }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: dist/winget/
          if-no-files-found: error
          retention-days: 7

  # R10: `winget validate`, which only runs on Windows. The snapshot's
  # installer URLs do not exist, so installing is left to the release.
  winget:
    name: winget validate
    needs: release-snapshot
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: winget
      - uses: ./.github/actions/winget-cli
      - name: winget validate
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Directory -Path winget/manifests/*/*/*/* | Select-Object -First 1
          winget validate --manifest $dir.FullName
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }
