# Proves the release's write paths without cutting a release: KMS signs the
# App JWT through GitHub OIDC, the App's installation covers the tap and the
# bucket, the token gets past their branch rules, and the AUR accepts the
# SSH key that KMS holds, signing through kmsp11. Any of these failing during a
# release would surface after the GitHub release and image are published,
# the expensive moment.
#
# With WINGET_ENABLED=true it also checks that the App can write to the
# organisation's fork of microsoft/winget-pkgs.
#
# Run it from the Actions tab on main. It pushes one empty commit to the
# tap and to the bucket, and creates and deletes one branch on the winget
# fork; nothing else changes.
name: Verify release credentials

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require the configuration
        env:
          TAP_APP_CLIENT_ID: ${{ vars.TAP_APP_CLIENT_ID }}
          TAP_WIF_PROVIDER: ${{ vars.TAP_WIF_PROVIDER }}
          TAP_KMS_KEY_VERSION: ${{ vars.TAP_KMS_KEY_VERSION }}
        run: |
          for v in TAP_APP_CLIENT_ID TAP_WIF_PROVIDER TAP_KMS_KEY_VERSION; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set"
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Mint a token for the tap and the bucket
        id: app_token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          workload-identity-provider: ${{ vars.TAP_WIF_PROVIDER }}
          kms-key-version: ${{ vars.TAP_KMS_KEY_VERSION }}

      # The push is the test: an empty commit still has to satisfy each
      # repository's rules, as the release's commit would.
      - name: Push an empty commit to the tap and the bucket
        env:
          TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          for repo in homebrew-tap scoop-bucket; do
            git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/stormlantern-dev/${repo}.git" "$repo"
            git -C "$repo" -c user.name="berthlight release" -c user.email=noreply@stormlantern.nl \
              commit -q --allow-empty -m "Verify berthlight's release credentials (${GITHUB_RUN_ID})"
            git -C "$repo" push -q
            echo "- wrote to stormlantern-dev/${repo}" >> "$GITHUB_STEP_SUMMARY"
          done

      # A branch, not a commit on the default branch: the fork's default
      # branch has to stay a copy of upstream's for merge-upstream.
      - name: Mint a token for the winget fork
        id: winget_token
        if: vars.WINGET_ENABLED == 'true'
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          workload-identity-provider: ${{ vars.TAP_WIF_PROVIDER }}
          kms-key-version: ${{ vars.TAP_KMS_KEY_VERSION }}
          repositories: winget-pkgs
      - name: Create and delete a branch on the winget fork
        if: vars.WINGET_ENABLED == 'true'
        env:
          TOKEN: ${{ steps.winget_token.outputs.token }}
          FORK: stormlantern-dev/winget-pkgs
        run: |
          set -euo pipefail
          api() { curl -fsS --retry 3 -H "Authorization: Bearer ${TOKEN}" -H 'Accept: application/vnd.github+json' "$@"; }
          repo=$(api "https://api.github.com/repos/${FORK}")
          parent=$(jq -er .parent.full_name <<< "$repo")
          test "$parent" = microsoft/winget-pkgs
          base=$(jq -er .default_branch <<< "$repo")
          sha=$(api "https://api.github.com/repos/${FORK}/git/ref/heads/${base}" | jq -er .object.sha)
          ref="verify-release-credentials-${GITHUB_RUN_ID}"
          api -X POST "https://api.github.com/repos/${FORK}/git/refs" \
            -d "$(jq -cn --arg r "refs/heads/${ref}" --arg s "$sha" '{ref: $r, sha: $s}')" > /dev/null
          api -X DELETE "https://api.github.com/repos/${FORK}/git/refs/heads/${ref}"
          echo "- wrote to ${FORK}, a fork of ${parent}" >> "$GITHUB_STEP_SUMMARY"

      # The AUR only once the account exists (AUR_ENABLED=true).
      - name: SSH agent with the AUR key
        id: aur
        if: vars.AUR_ENABLED == 'true'
        uses: ./.github/actions/aur-ssh
        with:
          workload-identity-provider: ${{ vars.TAP_WIF_PROVIDER }}
          key-ring: ${{ vars.AUR_KMS_KEY_RING }}

      # `help` answers only for a key on an AUR account. The same ssh
      # options as GoReleaser's git_ssh_command, with an empty environment
      # as GoReleaser gives git.
      - name: The AUR accepts the key
        if: vars.AUR_ENABLED == 'true'
        env:
          AGENT: ${{ steps.aur.outputs.agent }}
        run: |
          env -i /usr/bin/ssh -o IdentityAgent="$AGENT" -o IdentityFile=none -o StrictHostKeyChecking=accept-new -F /dev/null aur@aur.archlinux.org help
          echo "- the AUR accepted the key, signed in KMS" >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke the token, stop the agent
        if: always()
        env:
          TOKEN: ${{ steps.app_token.outputs.token }}
          WINGET_TOKEN: ${{ steps.winget_token.outputs.token }}
          AGENT_PID: ${{ steps.aur.outputs.pid }}
        run: |
          for t in "$TOKEN" "$WINGET_TOKEN"; do
            if [ -n "$t" ]; then
              curl -fsS -X DELETE -H "Authorization: Bearer ${t}" https://api.github.com/installation/token || true
            fi
          done
          if [ -n "$AGENT_PID" ]; then SSH_AGENT_PID="$AGENT_PID" ssh-agent -k > /dev/null || true; fi
          rm -f gha-creds-*.json
