# Publishes a release from a version tag (PRD 0001, R9): binaries, packages,
# the Homebrew cask, the Scoop manifest, the AUR package and the multi-arch
# proxy image, with signed checksums and build provenance. Then installs the
# release the way users do and runs it, and submits it to winget (R10).
#
# No stored secrets. The tap and bucket token comes from the release GitHub
# App, and the AUR push is signed with an SSH key; both keys live in Cloud
# KMS and are used through Workload Identity Federation (.github/actions).
# Repository variables: TAP_APP_CLIENT_ID, TAP_WIF_PROVIDER,
# TAP_KMS_KEY_VERSION and AUR_KMS_KEY_RING. AUR_ENABLED=true turns the AUR
# on; without it the release publishes everything else.
#
# winget: WINGET_ENABLED=true installs the release with winget and commits
# the manifests to the organisation's fork of microsoft/winget-pkgs, with
# the same App. A person opens the pull request upstream, from the link in
# the job summary: doing that from here would take a long-lived user token
# (PRD 0001, R10), which this project does not keep.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/stormlantern-dev/berthlight

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the proxy image on ghcr.io
      id-token: write # keyless signatures, attestations, and WIF for the App key and AUR key
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Mint a token for the tap and the bucket
        id: app_token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          workload-identity-provider: ${{ vars.TAP_WIF_PROVIDER }}
          kms-key-version: ${{ vars.TAP_KMS_KEY_VERSION }}
      - name: SSH agent with the AUR key
        id: aur
        if: vars.AUR_ENABLED == 'true'
        uses: ./.github/actions/aur-ssh
        with:
          workload-identity-provider: ${{ vars.TAP_WIF_PROVIDER }}
          key-ring: ${{ vars.AUR_KMS_KEY_RING }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          AUR_SSH_AGENT: ${{ steps.aur.outputs.agent }}
      # GoReleaser only writes the winget manifests; the winget jobs below
      # test and submit them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: dist/winget/
          if-no-files-found: error
      # Revoke rather than wait an hour for it to expire; stop the agent.
      - name: Revoke the token, stop the agent
        if: always()
        env:
          TOKEN: ${{ steps.app_token.outputs.token }}
          AGENT_PID: ${{ steps.aur.outputs.pid }}
        run: |
          if [ -n "$TOKEN" ]; then
            curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" https://api.github.com/installation/token || true
          fi
          if [ -n "$AGENT_PID" ]; then SSH_AGENT_PID="$AGENT_PID" ssh-agent -k > /dev/null || true; fi
          rm -f gha-creds-*.json

      # Attestations on private repositories need GitHub Enterprise Cloud.
      - name: Build provenance for the release files
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt

      - name: Image digest
        id: image
        run: |
          version="${GITHUB_REF_NAME#v}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$digest" && test "$digest" != null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.image.outputs.digest }}"
      - name: Build provenance for the image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # R9 fit: install the release as users do and run it.
  install-deb:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download, verify and install the .deb
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p '*_amd64.deb'
          if [ "${{ github.event.repository.private }}" != true ]; then
            gh attestation verify berthlight_*_amd64.deb --repo "$GH_REPO"
          fi
          sudo dpkg -i berthlight_*_amd64.deb
          berthlight version | grep -F "${GITHUB_REF_NAME#v}"

  # Homebrew and Scoop download from public URLs, so these run once the
  # repository is public.
  install-brew:
    needs: release
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # ubuntu-latest ships Homebrew but leaves it off PATH.
      - name: Put brew on PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - run: |
          brew install stormlantern-dev/tap/berthlight
          berthlight version | grep -F "${GITHUB_REF_NAME#v}"

  install-scoop:
    needs: release
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add stormlantern https://github.com/stormlantern-dev/scoop-bucket
          scoop install stormlantern/berthlight
          $v = berthlight version
          if ($v -notmatch [regex]::Escape($env:GITHUB_REF_NAME.TrimStart('v'))) { throw "unexpected version: $v" }

  install-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the image signature and run it
        run: |
          ref="$IMAGE:${GITHUB_REF_NAME#v}"
          cosign verify "$ref" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          docker run --rm --entrypoint /berthlight "$ref" version | grep -F "${GITHUB_REF_NAME#v}"

  # R10: install the release from its winget manifests before submitting
  # them; winget-pkgs' checklist asks for `winget validate` and
  # `winget install --manifest`. Not for pre-releases, as GoReleaser's
  # skip_upload: auto would.
  winget-test:
    needs: release
    if: ${{ vars.WINGET_ENABLED == 'true' && !contains(github.ref_name, '-') && !github.event.repository.private }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: winget
      - uses: ./.github/actions/winget-cli
      - name: winget validate, install, run
        shell: pwsh
        run: |
          $dir = (Get-ChildItem -Directory -Path winget/manifests/*/*/*/* | Select-Object -First 1).FullName
          winget validate --manifest $dir
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }
          winget install --manifest $dir --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget install failed ($LASTEXITCODE)" }
          $env:PATH = "$env:LOCALAPPDATA\Microsoft\WinGet\Links;$env:PATH"
          $v = berthlight version
          if ($v -notmatch [regex]::Escape($env:GITHUB_REF_NAME.TrimStart('v'))) { throw "unexpected version: $v" }

  winget:
    needs: winget-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF for the App key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/winget
      - name: Find the manifests
        id: dir
        run: |
          dirs=("$RUNNER_TEMP"/winget/manifests/*/*/*/*/)
          test "${#dirs[@]}" -eq 1
          echo "dir=${dirs[0]%/}" >> "$GITHUB_OUTPUT"
      - name: The manifests match the schemas
        id: manifests
        uses: ./.github/actions/winget-schema
        with:
          manifests: ${{ steps.dir.outputs.dir }}
      - name: Mint a token for the winget-pkgs fork
        id: app_token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          workload-identity-provider: ${{ vars.TAP_WIF_PROVIDER }}
          kms-key-version: ${{ vars.TAP_KMS_KEY_VERSION }}
          repositories: winget-pkgs
      - name: Push the branch for microsoft/winget-pkgs
        uses: ./.github/actions/winget-submit
        with:
          manifests: ${{ steps.dir.outputs.dir }}
          identifier: ${{ steps.manifests.outputs.identifier }}
          version: ${{ steps.manifests.outputs.version }}
          app-token: ${{ steps.app_token.outputs.token }}
          read-token: ${{ github.token }}
      - name: Revoke the App token
        if: always()
        env:
          TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          if [ -n "$TOKEN" ]; then
            curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" https://api.github.com/installation/token || true
          fi
          rm -f gha-creds-*.json
