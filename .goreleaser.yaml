# Release configuration (PRD 0001, R9). The release workflow runs it on a
# version tag; CI runs it as a snapshot on every pull request (R11).
#
# Publishing needs, from the release workflow (no stored secrets there; see
# .github/actions):
#   TAP_GITHUB_TOKEN  a one-hour release App token with contents: write on
#                     stormlantern-dev/homebrew-tap and scoop-bucket
#   AUR_SSH_AGENT     socket of an ssh-agent holding the AUR key, which lives
#                     in Cloud KMS (.github/actions/aur-ssh)
version: 2

project_name: berthlight

before:
  hooks:
    - go mod verify

builds:
  - id: berthlight
    main: ./cmd/berthlight
    binary: berthlight
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: berthlight
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Keyless: the signature is bound to the release workflow's identity.
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/stormlantern-dev/berthlight/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

nfpms:
  - id: packages
    package_name: berthlight
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm, apk]
    vendor: Stormlantern
    homepage: https://github.com/stormlantern-dev/berthlight
    maintainer: Dirk Louwers <dirk.louwers@stormlantern.nl>
    description: Stable names for devcontainer dev servers, without published ports.
    license: Apache-2.0
    bindir: /usr/bin
    recommends:
      - git
    suggests:
      - podman
      - docker

homebrew_casks:
  - name: berthlight
    binaries: [berthlight]
    description: Stable names for devcontainer dev servers, without published ports
    homepage: https://github.com/stormlantern-dev/berthlight
    license: Apache-2.0
    repository:
      owner: stormlantern-dev
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: berthlight release
      email: noreply@stormlantern.nl
    # The binary is not notarised; without this, macOS refuses to run it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/berthlight"]
          end

scoops:
  - name: berthlight
    description: Stable names for devcontainer dev servers, without published ports.
    homepage: https://github.com/stormlantern-dev/berthlight
    license: Apache-2.0
    repository:
      owner: stormlantern-dev
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: berthlight release
      email: noreply@stormlantern.nl

# winget (PRD 0001, R10). GoReleaser only WRITES the manifests here, to
# dist/winget, on every release and every snapshot; CI validates them
# against the winget schemas (.github/actions/winget-schema) and with
# `winget validate`. The winget jobs in release.yml test them with
# `winget install` and push them to the organisation's fork, and a person
# opens the pull request upstream: GoReleaser would need a long-lived user
# token for that, which this project does not keep (PRD 0001, R10). Jobs of
# their own also mean a winget failure cannot fail this job, which signs
# and attests the release after GoReleaser (GoReleaser exits non-zero when
# a publisher fails, after the others ran).
#
# So skip_upload is always true, and repository only names the fork the job
# pushes to. The job runs once WINGET_ENABLED=true; see release.yml.
winget:
  - name: berthlight
    publisher: Stormlantern
    publisher_url: https://github.com/stormlantern-dev
    publisher_support_url: https://github.com/stormlantern-dev/berthlight/issues
    package_identifier: Stormlantern.Berthlight
    package_name: berthlight
    author: Dirk Louwers
    short_description: Stable names for devcontainer dev servers, without published ports.
    description: |-
      berthlight gives each devcontainer's dev server a stable name such as
      http://gallery.localhost:7480, routed by one loopback-only proxy over
      per-project container networks. No published ports, no runtime socket,
      no root.
    homepage: https://github.com/stormlantern-dev/berthlight
    license: Apache-2.0
    license_url: https://github.com/stormlantern-dev/berthlight/blob/main/LICENSE
    release_notes_url: https://github.com/stormlantern-dev/berthlight/releases/tag/{{ .Tag }}
    tags: [devcontainer, docker, podman, proxy, localhost, cli]
    ids: [berthlight]
    skip_upload: "true"
    repository:
      owner: stormlantern-dev
      name: winget-pkgs

aurs:
  - name: berthlight-bin
    # Off until the AUR account exists (AUR_ENABLED in release.yml, which
    # only then starts the agent): the AUR closed registration for a while.
    disable: '{{ if index .Env "AUR_SSH_AGENT" }}false{{ else }}true{{ end }}'
    description: Stable names for devcontainer dev servers, without published ports.
    homepage: https://github.com/stormlantern-dev/berthlight
    license: Apache-2.0
    maintainers:
      - Dirk Louwers <dirk.louwers@stormlantern.nl>
    provides: [berthlight]
    conflicts: [berthlight]
    optdepends:
      - "git: route names from worktrees"
      - "podman: container runtime"
      - "docker: container runtime"
    # The key is in Cloud KMS and reached through an ssh-agent; there is no
    # key file. GoReleaser skips the AUR when private_key is empty and runs
    # git with only GIT_SSH_COMMAND set, so the agent is named in the
    # command and private_key just has to be non-empty.
    private_key: "{{ .Env.AUR_SSH_AGENT }}"
    git_ssh_command: 'ssh -o IdentityAgent="{{ .Env.AUR_SSH_AGENT }}" -o IdentityFile=none -o StrictHostKeyChecking=accept-new -F /dev/null'
    git_url: ssh://aur@aur.archlinux.org/berthlight-bin.git
    commit_author:
      name: berthlight release
      email: noreply@stormlantern.nl
    package: |-
      install -Dm755 "./berthlight" "${pkgdir}/usr/bin/berthlight"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/berthlight/LICENSE"

# The proxy image. The CLI runs ghcr.io/stormlantern-dev/berthlight:<version>
# by default (internal/cli), so the tag must be the bare version.
dockers_v2:
  - id: proxy
    images:
      - ghcr.io/stormlantern-dev/berthlight
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: berthlight proxy
      org.opencontainers.image.description: The berthlight proxy, routing *.localhost names to devcontainers.
      org.opencontainers.image.source: https://github.com/stormlantern-dev/berthlight
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: stormlantern-dev
    name: berthlight
  prerelease: auto
  footer: |
    Verify the checksums before use:

    ```sh
    cosign verify-blob --bundle checksums.txt.sigstore.json \
      --certificate-identity 'https://github.com/stormlantern-dev/berthlight/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
    sha256sum --check --ignore-missing checksums.txt
    ```

    Or with GitHub's build provenance: `gh attestation verify <file> --repo stormlantern-dev/berthlight`.
